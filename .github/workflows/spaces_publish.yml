name: Sync to Hugging Face hub
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      - name: Create repo
        run: bash hf.sh
      - name: Push to hub
        working-directory: hf
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: git push --force-with-lease https://MaxAtoms:$HF_TOKEN@huggingface.co/spaces/plotly/dash-app-template main