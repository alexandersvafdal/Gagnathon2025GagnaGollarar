[project]
name = "gagnathon2025"
version = "0.1.0"
description = "An interactive dashboard for simulating and forecasting key sectors of the Icelandic economy"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "autogluon>=1.4.0",
    "dash>=3.2.0",
    "dash-ag-grid>=32.3.2",
    "dash-bootstrap-components>=2.0.4",
    "gunicorn>=23.0.0",
    "matplotlib>=3.10.7",
    "numpy>=2.1.3",
    "pandas>=2.3.3",
    "plotly>=6.4.0",
    "pyarrow>=20.0.0",
    "scikit-learn>=1.7.2",
    "shap>=0.49.1",
]
